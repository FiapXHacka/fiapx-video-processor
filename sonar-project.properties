sonar.projectKey=FiapXHacka_fiapx-video-processor
sonar.organization=fiapxhacka
sonar.projectName=fiapx-video-processor

# SonarQube Cloud analyzes the whole repository and detects test files (*_test.go) by itself.
sonar.exclusions=**/testdata/**,**/vendor/**

sonar.go.coverage.reportPaths=coverage.out
# cmd/ is wiring only; it is exercised by the E2E tests in the fiapx repo.
sonar.coverage.exclusions=cmd/**
