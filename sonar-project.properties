sonar.projectKey=FiapXHacka_fiapx-video-processor
sonar.organization=fiapxhacka
sonar.projectName=fiapx-video-processor

sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**,**/vendor/**
