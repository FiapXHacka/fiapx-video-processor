name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test & analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # secretless SonarQube Cloud analysis (OIDC), no SONAR_TOKEN secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs the history for blame and new code

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install ffmpeg (adapter integration tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Test
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # Exchanges the job's GitHub OIDC token for a 30-minute token scoped to this repo's project
      # and exports it as SONAR_TOKEN. Organization and key come from sonar-project.properties.
      - name: SonarQube Cloud auth (secretless)
        uses: SonarSource/sonarqube-auth-action@v1

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (push comes with the deploy workflow, issue #8)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fiapx-video-processor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
