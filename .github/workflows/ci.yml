name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (tag in the comment); Dependabot keeps them updated.
jobs:
  test:
    name: Lint, test & analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # secretless SonarQube Cloud analysis (OIDC), no SONAR_TOKEN secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs the history for blame and new code

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install ffmpeg (adapter integration tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Test
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # Exchanges the job's GitHub OIDC token for a 30-minute token scoped to this repo's project
      # and exports it as SONAR_TOKEN. Organization and key come from sonar-project.properties.
      - name: SonarQube Cloud auth (secretless)
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (push comes with the deploy workflow, issue #8)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: fiapx-video-processor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
